<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Maximum Lösung</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css">
    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>

    <style>
        .code-window {
            display: block;
            height: auto;
            margin-bottom: 30px;
            /* Kein Rahmen, kein Hintergrund, keine Rundung */
            border: none;
            border-radius: 0;
            background: none;
            overflow: visible;
        }
    </style>
</head>
<body>
    <header>
        <nav><a href="zzUebung_loesungen.html">← Zurück</a></nav>
        <h1>Lösung: Maximum Lösungen</h1>
    </header>

    <main>
        <p>Hauptklasse <strong>"Maximum"</strong>:</p>
        <div class="code-window">
            <zero-md src="Maximum.java" no-config>
                <template>
                    <style>
                        pre {
                            background: none !important;
                            color: #ffffff !important;
                            font-family: 'Courier New', monospace !important;
                            font-size: 14px !important;
                            line-height: 1.5 !important;
                            padding: 0;
                            margin: 0;
                            white-space: pre !important;
                        }
                        /* Package-Zeile wie Code einfärben */
                        code span.token.keyword, code span.token.namespace, code span.token.package {
                            color: #fdfafa !important;
                        }
                    </style>
                </template>
            </zero-md>
        </div>

        <p>Test-Klasse "MaximumTest":</p>
        <div class="code-window">
            <zero-md src="MaximumTest.java" no-config>
                <template>
                    <style>
                        pre {
                            background: none !important;
                            color: #fbf9f9 !important;
                            font-family: 'Courier New', monospace !important;
                            font-size: 14px !important;
                            line-height: 1.5 !important;
                            padding: 0;
                            margin: 0;
                            white-space: pre !important;
                        }
                        code span.token.keyword, code span.token.namespace, code span.token.package {
                            color: #f9f7f7 !important;
                        }
                    </style>
                </template>
            </zero-md>
        </div>
    </main>
    <footer>
        <p>Lösungen by KCK - PRO2</p>
    </footer>
</body>
</html>
